name: build-custom

# 个人镜像：MoviePilot v2 + patches/ + plugins-vendor/
# 产物标签（每次构建打 4 个，都带推送日期，便于回溯与上游同步管理）：
#   <APP_VERSION>-custom-<YYYYMMDD>-<sha7>   完全唯一，永不覆盖（推荐用于回滚引用）
#   <APP_VERSION>-custom-<YYYYMMDD>          当天构建的最新一次（同日重构会移动）
#   <APP_VERSION>-custom                     该上游版本的最新一次
#   custom                                   始终指向最新构建（compose 日常用）
#
# 与上游 build.yml 的区别：
#   - 只推 ghcr（用 GITHUB_TOKEN，无需 DockerHub secrets）
#   - 只构建 linux/amd64（NAS 是 x86；需要 arm64 就把下面 platforms 加回来）
#   - 不做「生成插件市场默认列表 / commit 回分支」这些上游发布流程

on:
  workflow_dispatch:
  push:
    branches:
      - custom
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'patches/**.md'

permissions:
  contents: read
  packages: write

jobs:
  Docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          app_version=$(sed -ne "s/APP_VERSION\s*=\s*'v\(.*\)'/\1/gp" version.py)
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 两个坑：
      #   1) ghcr 镜像名必须全小写，而 github.repository_owner 保留账号原始大小写（Enderiose）
      #   2) 包名用仓库名 moviepilot —— 已有的 moviepilot-v2 包是「账号所有」且未关联本仓库，
      #      fork 的 GITHUB_TOKEN 写它会被拒（permission_denied: read_package）
      - name: Resolve image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          date=$(TZ=Asia/Shanghai date +%Y%m%d)
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "name=ghcr.io/${owner}/moviepilot"
            echo "date=${date}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"
          echo "镜像: ghcr.io/${owner}/moviepilot:${APP_VERSION}-custom-${date}-${sha}"

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.APP_VERSION }}-custom-${{ steps.img.outputs.date }}-${{ steps.img.outputs.sha }}
            ${{ steps.img.outputs.name }}:${{ env.APP_VERSION }}-custom-${{ steps.img.outputs.date }}
            ${{ steps.img.outputs.name }}:${{ env.APP_VERSION }}-custom
            ${{ steps.img.outputs.name }}:custom
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}-custom-${{ steps.img.outputs.date }}
            org.opencontainers.image.created=${{ steps.img.outputs.date }}
          cache-from: type=gha,scope=moviepilot-custom
          cache-to: type=gha,scope=moviepilot-custom,mode=max
