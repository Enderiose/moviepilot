name: build-custom

# 个人镜像：MoviePilot v2 + patches/
# 产物：ghcr.io/<owner>/moviepilot-v2:<APP_VERSION>-custom 与 :custom
#
# 与上游 build.yml 的区别：
#   - 只推 ghcr（用 GITHUB_TOKEN，无需 DockerHub secrets）
#   - 只构建 linux/amd64（NAS 是 x86；需要 arm64 就把下面 platforms 加回来）
#   - 不做「生成插件市场默认列表 / commit 回分支」这些上游发布流程

on:
  workflow_dispatch:
  push:
    branches:
      - custom
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'patches/**.md'

permissions:
  contents: read
  packages: write

jobs:
  Docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          app_version=$(sed -ne "s/APP_VERSION\s*=\s*'v\(.*\)'/\1/gp" version.py)
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像名必须全小写，而 github.repository_owner 会保留账号原始大小写（Enderiose）
      - name: Resolve image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/moviepilot-v2" >> "$GITHUB_OUTPUT"
          echo "镜像名: ghcr.io/${owner}/moviepilot-v2"

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.APP_VERSION }}-custom
            ${{ steps.img.outputs.name }}:custom
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}-custom
          cache-from: type=gha,scope=moviepilot-custom
          cache-to: type=gha,scope=moviepilot-custom,mode=max
